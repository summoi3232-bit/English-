<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23305a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>خطة الإنجليزية</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#17203d;--mute:#5d6786;--line:#dde2f0;--acc:#23305a;--ok:#1f9d7a;--hi:#e6ebfa;--on:#fff;box-sizing:border-box;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1426;--card:#171d35;--ink:#e9ecf8;--mute:#97a1c4;--line:#2a3354;--acc:#8fa6ff;--ok:#4fd1ac;--hi:#1e2746;--on:#0f1426;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;line-height:1.6;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:620px;margin:0 auto;padding:16px 14px 90px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
h1{font-size:1.5rem;margin:0;color:var(--acc)}
.meta{color:var(--mute);font-size:.88rem;margin:2px 0 0}
.streak{background:var(--hi);color:var(--acc);border-radius:12px;padding:6px 12px;font-weight:700;text-align:center;white-space:nowrap}
.streak small{display:block;font-weight:400;font-size:.72rem;color:var(--mute)}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;padding:10px 4px;min-height:48px;border-radius:10px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--hi);color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:1.05rem;margin:0 0 10px}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cw{text-align:center}
.ring{width:118px;height:118px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center}
.ring div{width:92px;height:92px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.ring small{display:block;font-size:.7rem;font-weight:400;color:var(--mute);margin-top:-14px}
.cw b{display:block;font-size:.92rem;margin-bottom:6px}
.row{display:flex;gap:6px}
.add{flex:1;min-height:48px;border:0;border-radius:12px;background:var(--acc);color:var(--on);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;touch-action:manipulation}
.add:active{transform:scale(.97)}
.sub{width:48px;min-height:48px;border:1px solid var(--line);background:none;color:var(--mute);border-radius:12px;font:inherit;font-size:1.2rem;cursor:pointer}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.chk{flex:none;width:32px;height:32px;border-radius:9px;border:2px solid var(--line);background:none;color:var(--on);font-size:1rem;cursor:pointer}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.tt{flex:1}
.tt span{display:block}
.tt small{color:var(--mute)}
.done .tt span{text-decoration:line-through;color:var(--mute)}
.tag{font-size:.7rem;background:var(--hi);color:var(--acc);border-radius:6px;padding:0 6px;margin-inline-start:6px}
.lk{flex:none;color:var(--acc);font-size:.85rem;padding:8px 6px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.wd{border-inline-start:4px solid var(--line)}
.wd.today{border-inline-start-color:var(--acc)}
.wd ul{margin:6px 0 0;padding-inline-start:18px;color:var(--mute);font-size:.9rem}
.wd li.d{text-decoration:line-through}
.chart{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:8px}
.chart i{flex:1;background:var(--ok);border-radius:4px 4px 0 0;min-height:3px;opacity:.9}
.chart i.z{background:var(--line)}
.ph{padding:8px 10px;border-radius:10px;margin-bottom:6px;border:1px solid var(--line)}
.ph.cur{background:var(--hi);border-color:var(--acc)}
.ph b{display:block}
.ph span{color:var(--mute);font-size:.88rem}
.link{display:inline-block;margin:4px 0}
button.rs{border:1px solid var(--line);background:none;color:var(--mute);border-radius:10px;min-height:44px;padding:0 14px;font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hide{display:none}
label.g{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
input[type=number]{width:80px;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:0 8px;text-align:center}
</style>
</head>
<body>
<main>
<header>
<div><h1>خطة الإنجليزية</h1><p class="meta" id="meta"></p></div>
<div class="streak"><span id="stk">0</span><small>أيام متتالية</small></div>
</header>

<section id="v-today"></section>
<section id="v-week" class="hide"></section>
<section id="v-prog" class="hide"></section>
</main>
<nav role="tablist">
<button role="tab" data-v="today" aria-selected="true">اليوم</button>
<button role="tab" data-v="week" aria-selected="false">الأسبوع</button>
<button role="tab" data-v="prog" aria-selected="false">التقدم</button>
</nav>

<script>
var DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var U={anki:"https://apps.ankiweb.net",bc:"https://learnenglish.britishcouncil.org",bbc:"https://www.bbc.co.uk/learningenglish",nil:"https://www.newsinlevels.com",wiki:"https://simple.wikipedia.org",lt:"https://languagetool.org",lucy:"https://www.youtube.com/@EnglishwithLucy",emma:"https://www.youtube.com/@PronunciationWithEmma",te:"https://www.teachingenglish.org.uk",ht:"https://www.hellotalk.com"};
function T(t,m,u,x){return{t:t,m:m,u:u,x:!!x}}
var PLAN=[
[T("مراجعة بطاقات Anki",10,"anki"),T("قواعد: وحدة من English Grammar in Use أو درس من British Council",20,"bc"),T("استماع: 6 Minute English مع النص",30,"bbc",1)],
[T("مراجعة بطاقات Anki",10,"anki"),T("قراءة نص من News in Levels (المستوى 1-2) وتدوين 5 كلمات",20,"nil"),T("كتابة 5-8 جمل عن يومك وتصحيحها في LanguageTool",30,"lt",1)],
[T("مراجعة بطاقات Anki",10,"anki"),T("استماع وتقليد (shadowing) لمقطع قصير",20,"lucy"),T("نطق: درس من Pronunciation with Emma",30,"emma",1)],
[T("مراجعة بطاقات Anki",15,"anki"),T("قواعد: وحدتان مع التمارين",30,"bc"),T("قراءة: Simple English Wikipedia عن موضوع في تخصصك",30,"wiki"),T("استماع: 6 Minute English مرتين، بلا نص ثم بنص",30,"bbc"),T("كتابة فقرة من 5-6 جمل وتصحيحها",30,"lt")],
[T("مراجعة بطاقات Anki",15,"anki"),T("تحدث: سجّل صوتك دقيقتين ثم استمع وصحّح",30,"ht"),T("استخرج 10 كلمات جديدة من قراءتك وأضفها إلى Anki",30,"anki"),T("فيديو أو مسلسل بترجمة إنجليزية",30,"lucy"),T("مراجعة الأسبوع: أخطائي المتكررة وما لم أفهمه",30)],
[T("مراجعة بطاقات Anki",10,"anki"),T("فيديو أو مسلسل بترجمة إنجليزية",20,"lucy"),T("قراءة مبسطة في تعليم الإنجليزية (TeachingEnglish)",30,"te",1)],
[T("مراجعة بطاقات Anki",10,"anki"),T("مراجعة قواعد الأسبوع دون النظر في الكتاب",20,"bc"),T("تحدث بصوت عالٍ: صف يومك دقيقتين مع تسجيل",30,"ht",1)]
];
var PH=[
["التأسيس","الأشهر 1-3","قواعد أساسية، 1000 كلمة شائعة، تعوّد الأذن على النطق"],
["البناء","الأشهر 4-9","نصوص بسيطة وجمل متصلة في الكتابة والكلام"],
["المتوسط","الأشهر 10-15","مواد أصلية (BBC، TED) وطلاقة نسبية"],
["الأكاديمي","الأشهر 16-24","قراءة وكتابة وعروض بمستوى الماستر"]
];
var K="eng-plan-v1";
var S={start:ymd(new Date()),days:{},goals:{rev:30,neu:10}};
function ymd(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function add(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r}
function load(){try{var r=JSON.parse(localStorage.getItem(K));if(r&&r.start)S=r}catch(e){}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function get(k){return S.days[k]||{done:[],rev:0,neu:0}}
function mut(k){return S.days[k]||(S.days[k]={done:[],rev:0,neu:0})}
function tid(di,i){return di+"-"+i}
function coreDone(d){var di=d.getDay(),g=get(ymd(d));return PLAN[di].every(function(t,i){return t.x||g.done.indexOf(tid(di,i))>-1})}
function mins(d){var di=d.getDay(),g=get(ymd(d)),s=0;PLAN[di].forEach(function(t,i){if(g.done.indexOf(tid(di,i))>-1)s+=t.m});return s}
function streak(){var n=0,t=new Date();for(var i=0;i<400;i++){var d=add(t,-i);if(coreDone(d))n++;else if(i>0)break}return n}
function ring(v,goal){var p=goal?Math.min(100,v/goal*100):0;return '<div class="ring" style="background:conic-gradient(var(--ok) '+p+'%,var(--line) 0)"><div><span>'+v+'<small>من '+goal+'</small></span></div></div>'}

function rToday(){
  var t=new Date(),k=ymd(t),di=t.getDay(),g=get(k),tot=0,dn=0;
  var h='<div class="card"><h2>عدّاد اليوم</h2><div class="rings">';
  h+='<div class="cw"><b>مراجعات Anki</b>'+ring(g.rev,S.goals.rev)+'<div class="row"><button class="add" data-c="rev">+1</button><button class="sub" data-c="rev" data-n="-1" aria-label="إنقاص">−</button></div></div>';
  h+='<div class="cw"><b>كلمات جديدة</b>'+ring(g.neu,S.goals.neu)+'<div class="row"><button class="add" data-c="neu">+1</button><button class="sub" data-c="neu" data-n="-1" aria-label="إنقاص">−</button></div></div>';
  h+='</div></div><div class="card"><h2>مهام '+DAYS[di]+'</h2>';
  var ts="";
  PLAN[di].forEach(function(x,i){
    var id=tid(di,i),on=g.done.indexOf(id)>-1;tot+=x.m;if(on)dn+=x.m;
    ts+='<div class="task'+(on?' done':'')+'"><button class="chk" data-t="'+id+'" aria-pressed="'+on+'" aria-label="إنجاز">'+(on?'✓':'')+'</button><div class="tt"><span>'+x.t+(x.x?'<em class="tag">إضافي</em>':'')+'</span><small>'+x.m+' دقيقة</small></div>'+(x.u?'<a class="lk" href="'+U[x.u]+'" target="_blank" rel="noopener">فتح</a>':'')+'</div>';
  });
  h+='<div class="bar"><i style="width:'+(tot?dn/tot*100:0)+'%"></i></div><small class="meta">أنجزت '+dn+' من '+tot+' دقيقة</small>'+ts+'</div>';
  return h;
}
function rWeek(){
  var t=new Date(),st=add(t,-t.getDay()),h="";
  for(var i=0;i<7;i++){
    var d=add(st,i),g=get(ymd(d)),tot=0,dn=0,li="";
    PLAN[i].forEach(function(x,j){var on=g.done.indexOf(tid(i,j))>-1;tot+=x.m;if(on)dn+=x.m;li+='<li class="'+(on?'d':'')+'">'+x.t+' ('+x.m+'د)</li>'});
    h+='<div class="card wd'+(i===t.getDay()?' today':'')+'"><h2>'+DAYS[i]+(i===3||i===4?' <span class="tag">يوم تفرغ</span>':'')+'</h2><div class="bar"><i style="width:'+(tot?dn/tot*100:0)+'%"></i></div><small class="meta">'+dn+' / '+tot+' دقيقة</small><ul>'+li+'</ul></div>';
  }
  return h;
}
function rProg(){
  var t=new Date(),days=Math.max(0,Math.floor((t-new Date(S.start+"T00:00:00"))/864e5)),mo=days/30.44;
  var pi=mo<3?0:mo<9?1:mo<15?2:3,tm=0,tr=0,tn=0,cd=0,bars="";
  for(var i=13;i>=0;i--){var d=add(t,-i),m=mins(d),g=get(ymd(d));tm+=m;tr+=g.rev;tn+=g.neu;if(coreDone(d))cd++;bars+='<i class="'+(m?'':'z')+'" style="height:'+Math.max(3,Math.min(100,m/135*100))+'%" title="'+ymd(d)+': '+m+'د"></i>'}
  var h='<div class="card"><h2>آخر 14 يومًا (دقائق الدراسة)</h2><div class="chart">'+bars+'</div><p class="meta">'+tm+' دقيقة، '+tr+' مراجعة، '+tn+' كلمة جديدة، و'+cd+' يومًا أنجزت فيه المهام الأساسية</p></div>';
  h+='<div class="card"><h2>المراحل</h2>';
  PH.forEach(function(p,i){h+='<div class="ph'+(i===pi?' cur':'')+'"><b>'+p[0]+' ('+p[1]+')'+(i===pi?' ← أنت هنا':'')+'</b><span>'+p[2]+'</span></div>'});
  h+='<p class="meta">اليوم '+(days+1)+' من رحلتك، الأسبوع '+(Math.floor(days/7)+1)+'. تاريخ البداية: '+S.start+'</p></div>';
  h+='<div class="card"><h2>الأهداف اليومية</h2><label class="g">مراجعات Anki<input type="number" min="0" max="500" id="gr" value="'+S.goals.rev+'"></label><label class="g">كلمات جديدة<input type="number" min="0" max="100" id="gn" value="'+S.goals.neu+'"></label></div>';
  h+='<div class="card"><h2>مصادر مجانية</h2>';
  [["Anki (بطاقات المراجعة)","anki"],["British Council LearnEnglish","bc"],["BBC Learning English","bbc"],["News in Levels","nil"],["LanguageTool (تصحيح الكتابة)","lt"],["HelloTalk (شريك محادثة)","ht"]].forEach(function(r){h+='<a class="link" href="'+U[r[1]]+'" target="_blank" rel="noopener">'+r[0]+'</a><br>'});
  h+='</div><button class="rs" id="rst">مسح كل البيانات وبدء رحلة جديدة</button>';
  return h;
}
var cur="today";
function render(){
  document.getElementById("v-today").innerHTML=rToday();
  document.getElementById("v-week").innerHTML=rWeek();
  document.getElementById("v-prog").innerHTML=rProg();
  document.getElementById("stk").textContent=streak();
  var t=new Date(),dd=Math.max(0,Math.floor((t-new Date(S.start+"T00:00:00"))/864e5));
  document.getElementById("meta").textContent=DAYS[t.getDay()]+" - الأسبوع "+(Math.floor(dd/7)+1);
}
function show(v){
  cur=v;
  ["today","week","prog"].forEach(function(n){document.getElementById("v-"+n).classList.toggle("hide",n!==v)});
  var bs=document.querySelectorAll("nav button");
  for(var i=0;i<bs.length;i++)bs[i].setAttribute("aria-selected",bs[i].dataset.v===v);
  window.scrollTo(0,0);
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.v){show(b.dataset.v);return}
  var k=ymd(new Date());
  if(b.dataset.c){var g=mut(k),f=b.dataset.c,n=parseInt(b.dataset.n||"1",10);g[f]=Math.max(0,g[f]+n);save();render();if(n>0){try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}}return}
  if(b.dataset.t){var g2=mut(k),ix=g2.done.indexOf(b.dataset.t);if(ix>-1)g2.done.splice(ix,1);else g2.done.push(b.dataset.t);save();render();return}
  if(b.id==="rst"){if(confirm("سيتم حذف كل تقدمك. هل أنت متأكد؟")){S={start:ymd(new Date()),days:{},goals:{rev:30,neu:10}};save();render()}}
});
document.addEventListener("change",function(e){
  if(e.target.id==="gr"||e.target.id==="gn"){
    var v=Math.max(0,parseInt(e.target.value,10)||0);
    S.goals[e.target.id==="gr"?"rev":"neu"]=v;save();var c=cur;render();show(c);
  }
});
load();save();render();show("today");
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
